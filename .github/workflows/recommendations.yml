# Copied to .github/workflows/recommendations.yml in exacting-hook/catridge-releases.
# Rebuilds recommendations/v1.json every two days, when a page source is added or
# changed, and on demand (Actions → Recommendations → Run workflow). It never creates
# releases; it only commits the rebuilt list when it changed.
name: Recommendations

on:
  schedule:
    - cron: "23 5 */2 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "recommendations/sources/**"
      - "recommendations/build.mjs"

permissions:
  contents: write

concurrency:
  group: recommendations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test recommendations/build.test.mjs
      - run: node recommendations/build.mjs
      - name: Commit the list if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recommendations
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update recommendations"
            git push
          fi
